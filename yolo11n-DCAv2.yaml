# yolo11n + DCAConv_v2
#
# DCAv2: backbone 通道判别增强，基于 Beer-Lambert 物理先验。
#        对低对比度退化场景下的通道选择性退化进行逆补偿。
#
# 消融实验:
#   yolo11.yaml              → E1: baseline
#   yolo11n-DCAv2.yaml       → E2: +DCAv2
#   yolo11n-CFD.yaml         → E3: +CFD
#   yolo11n-DCAv2-CFD.yaml   → E4: +DCAv2 + CFD

nc: 10
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, DCAConv_v2, []]             # 5  P3 + DCAv2
  - [-1, 1, Conv, [512, 3, 2]]          # 6  P4/16
  - [-1, 2, C3k2, [512, True]]          # 7
  - [-1, 1, DCAConv_v2, []]             # 8  P4 + DCAv2
  - [-1, 1, Conv, [1024, 3, 2]]         # 9  P5/32
  - [-1, 2, C3k2, [1024, True]]         # 10
  - [-1, 1, SPPF, [1024, 5]]            # 11
  - [-1, 2, C2PSA, [1024]]              # 12 P5

head:
  # FPN top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 13
  - [[-1, 7], 1, Concat, [1]]                      # 14  cat backbone P4 C3k2
  - [-1, 2, C3k2, [512, False]]                    # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 16
  - [[-1, 4], 1, Concat, [1]]                      # 17  cat backbone P3 C3k2
  - [-1, 2, C3k2, [256, False]]                    # 18 (P3/8-small)

  # PAN bottom-up
  - [-1, 1, Conv, [256, 3, 2]]                     # 19
  - [[-1, 15], 1, Concat, [1]]                     # 20  cat head P4 FPN
  - [-1, 2, C3k2, [512, False]]                    # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                     # 22
  - [[-1, 12], 1, Concat, [1]]                     # 23  cat backbone P5
  - [-1, 2, C3k2, [1024, True]]                    # 24 (P5/32-large)

  - [[18, 21, 24], 1, Detect, [nc]]                 # 25
