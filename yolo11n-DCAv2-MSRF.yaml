# yolo11n + DCAv2 + MSRF
#
# DCAv2: backbone 通道增强 — Beer-Lambert 修复光度退化
# MSRF:  P3 小目标感受野重塑 — 多尺度深度卷积扩大感知范围
#
# 互补设计:
#   DCAv2 → 特征质量 (通道维度, photometric)
#   MSRF  → 感知覆盖 (空间维度, geometric)
#   DCAv2 在 backbone 全层级, MSRF 仅在 P3 检测头前

nc: 10
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, DCAConv_v2, []]             # 5  P3 + DCAv2
  - [-1, 1, Conv, [512, 3, 2]]          # 6  P4/16
  - [-1, 2, C3k2, [512, True]]          # 7
  - [-1, 1, DCAConv_v2, []]             # 8  P4 + DCAv2
  - [-1, 1, Conv, [1024, 3, 2]]         # 9  P5/32
  - [-1, 2, C3k2, [1024, True]]         # 10
  - [-1, 1, SPPF, [1024, 5]]            # 11
  - [-1, 2, C2PSA, [1024]]              # 12
  - [-1, 1, DCAConv_v2, []]             # 13 P5 + DCAv2

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 7], 1, Concat, [1]]                       # 15
  - [-1, 2, C3k2, [512, False]]                     # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 17
  - [[-1, 4], 1, Concat, [1]]                        # 18
  - [-1, 2, C3k2, [256, False]]                      # 19 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                       # 20
  - [[-1, 16], 1, Concat, [1]]                       # 21
  - [-1, 2, C3k2, [512, False]]                      # 22 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                       # 23
  - [[-1, 13], 1, Concat, [1]]                       # 24
  - [-1, 2, C3k2, [1024, True]]                      # 25 (P5/32-large)

  # MSRF on P3 only (small-object head)
  - [19, 1, MSRF, []]                                 # 26 P3 + MSRF
  - [[26, 22, 25], 1, Detect, [nc]]                   # 27 P3_enh + P4 + P5
