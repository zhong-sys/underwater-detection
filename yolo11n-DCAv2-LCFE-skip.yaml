# yolo11n + DCAv2 + LCFE
#
# Main structure:
# - DCAConv_v2 is inserted after P3/P4 backbone features.
# - Top-down skips use DCAConv_v2-enhanced P4/P3 layers.
# - LCFE is inserted after P4/P3 Concat and before C3k2.

nc: 10
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, DCAConv_v2, []]             # 5  P3 + DCAv2
  - [-1, 1, Conv, [512, 3, 2]]          # 6  P4/16
  - [-1, 2, C3k2, [512, True]]          # 7
  - [-1, 1, DCAConv_v2, []]             # 8  P4 + DCAv2
  - [-1, 1, Conv, [1024, 3, 2]]         # 9  P5/32
  - [-1, 2, C3k2, [1024, True]]         # 10
  - [-1, 1, SPPF, [1024, 5]]            # 11
  - [-1, 2, C2PSA, [1024]]              # 12 P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 13
  - [[-1, 8], 1, Concat, [1]]                       # 14  cat DCAv2-enhanced P4
  - [-1, 1, LCFE, []]                               # 15  P4 local contrast enhancement
  - [-1, 2, C3k2, [512, False]]                     # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 17
  - [[-1, 5], 1, Concat, [1]]                       # 18  cat DCAv2-enhanced P3
  - [-1, 1, LCFE, []]                               # 19  P3 local contrast enhancement
  - [-1, 2, C3k2, [256, False]]                     # 20 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                      # 21
  - [[-1, 16], 1, Concat, [1]]                      # 22  cat head P4 FPN
  - [-1, 2, C3k2, [512, False]]                     # 23 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                      # 24
  - [[-1, 12], 1, Concat, [1]]                      # 25  cat backbone P5
  - [-1, 2, C3k2, [1024, True]]                     # 26 (P5/32-large)

  - [[20, 23, 26], 1, Detect, [nc]]                 # 27
