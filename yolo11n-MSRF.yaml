# yolo11n + MSRF (Multi-Scale Receptive Field) for P3 small-object head
#
# MSRF: 在 P3 检测头前插入三路并行深度卷积(3×3 / 7×7 / d=3)，
#        扩大小目标检测的感受野，让 15-20px 的物体跨越多个 grid cell
#        也能被完整"看见"。
#
# 消融实验:
#   yolo11.yaml              → E1: baseline
#   yolo11n-DCAv2.yaml       → E2: +DCAv2
#   yolo11n-MSRF.yaml        → E3: +MSRF
#   yolo11n-DCAv2-MSRF.yaml  → E4: +DCAv2 + MSRF

nc: 10
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5  P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                       # 12
  - [-1, 2, C3k2, [512, False]]                     # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 14
  - [[-1, 4], 1, Concat, [1]]                        # 15
  - [-1, 2, C3k2, [256, False]]                      # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                       # 17
  - [[-1, 13], 1, Concat, [1]]                       # 18
  - [-1, 2, C3k2, [512, False]]                      # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                       # 20
  - [[-1, 10], 1, Concat, [1]]                       # 21
  - [-1, 2, C3k2, [1024, True]]                      # 22 (P5/32-large)

  # MSRF on P3 only (small-object head)
  - [16, 1, MSRF, []]                                 # 23 P3 + MSRF
  - [[23, 19, 22], 1, Detect, [nc]]                   # 24 P3_enh + P4 + P5
