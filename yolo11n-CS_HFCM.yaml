# yolo11n + CS_HFCM (Cross-Scale High-Frequency Compensation)
#
# CS_HFCM: 替换 FPN 标准 Concat，用固定 Laplacian 高通滤波提取
#          backbone 浅层的边缘细节，跨尺度注入 neck 深层特征。
#          浊度区域的平滑噪声被空间门控抑制，物体边界保留。
#
# 消融实验:
#   yolo11.yaml                  → E1: baseline
#   yolo11n-DCAv2.yaml           → E2: +DCAv2
#   yolo11n-CS_HFCM.yaml         → E3: +CS_HFCM
#   yolo11n-DCAv2-CS_HFCM.yaml   → E4: +DCAv2 + CS_HFCM

nc: 10
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4  backbone P3
  - [-1, 1, Conv, [512, 3, 2]]          # 5  P4/16
  - [-1, 2, C3k2, [512, True]]          # 6  backbone P4
  - [-1, 1, Conv, [1024, 3, 2]]         # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10 backbone P5

head:
  # FPN top-down (Concat -> CS_HFCM at skip connections)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11  P5 -> P4
  - [[-1, 6], 1, CS_HFCM, []]                       # 12  +backbone P4 (cross-scale)
  - [-1, 2, C3k2, [512, False]]                     # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 14  P4 -> P3
  - [[-1, 4], 1, CS_HFCM, []]                        # 15  +backbone P3 (cross-scale)
  - [-1, 2, C3k2, [256, False]]                      # 16 (P3/8-small)

  # PAN bottom-up (standard)
  - [-1, 1, Conv, [256, 3, 2]]                      # 17
  - [[-1, 13], 1, Concat, [1]]                       # 18
  - [-1, 2, C3k2, [512, False]]                      # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                       # 20
  - [[-1, 10], 1, Concat, [1]]                       # 21
  - [-1, 2, C3k2, [1024, True]]                      # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]                   # 23
