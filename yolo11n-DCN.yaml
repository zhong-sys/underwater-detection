# yolo11n + CAGDCN (Deformable Convolution Neck)
#
# CAGDCN: 颈部 PAN 路径可变形卷积 — 学习空间采样偏移，适应水下
#           目标的非刚性形变（鱼弯曲、水母变形）和遮挡（鱼群、珊瑚）。
#
# 与 DCAv2 互补:
#   DCAv2: 光度维度 — 吸收/散射 → 通道响应退化 (backbone)
#   DCN:   几何维度 — 形变/遮挡   → 不规则感受野 (neck)
#
# 消融实验:
#   yolo11.yaml              → E1: baseline
#   yolo11n-DCAv2.yaml       → E2: +DCAv2
#   yolo11n-DCN.yaml         → E3: +DCN
#   yolo11n-DCAv2-DCN.yaml   → E4: +DCAv2 + DCN

nc: 10
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5  P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10

head:
  # FPN top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 11
  - [[-1, 6], 1, Concat, [1]]                      # 12
  - [-1, 2, C3k2, [512, False]]                    # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 4], 1, Concat, [1]]                      # 15
  - [-1, 2, C3k2, [256, False]]                    # 16 (P3/8-small)

  # PAN bottom-up + DCN
  - [-1, 1, Conv, [256, 3, 2]]                     # 17  P3→P4
  - [-1, 1, CAGDCN, []]                           # 18  +DCN
  - [[-1, 13], 1, Concat, [1]]                     # 19
  - [-1, 2, C3k2, [512, False]]                    # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                     # 21  P4→P5
  - [-1, 1, CAGDCN, []]                           # 22  +DCN
  - [[-1, 10], 1, Concat, [1]]                     # 23
  - [-1, 2, C3k2, [1024, True]]                    # 24 (P5/32-large)

  - [[16, 20, 24], 1, Detect, [nc]]                 # 25
