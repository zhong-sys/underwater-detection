# yolo11n + DCAv2 + CS_HFCM
#
# DCAv2:   backbone 通道增强 — Beer-Lambert 物理先验修复光度退化
# CS_HFCM: neck 跨尺度高频补偿 — Laplacian 边缘注入修复散射模糊
#
# 互补设计:
#   DCAv2 → 通道维度 (absorption)  → 修复"哪些通道被衰减"
#   CS_HFCM → 空间维度 (scattering) → 修复"哪些细节被模糊"
#
# 消融实验:
#   yolo11.yaml                  → E1: baseline
#   yolo11n-DCAv2.yaml           → E2: +DCAv2
#   yolo11n-CS_HFCM.yaml         → E3: +CS_HFCM
#   yolo11n-DCAv2-CS_HFCM.yaml   → E4: +DCAv2 + CS_HFCM

nc: 10
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4  backbone P3
  - [-1, 1, DCAConv_v2, []]             # 5  P3 + DCAv2
  - [-1, 1, Conv, [512, 3, 2]]          # 6  P4/16
  - [-1, 2, C3k2, [512, True]]          # 7  backbone P4
  - [-1, 1, DCAConv_v2, []]             # 8  P4 + DCAv2
  - [-1, 1, Conv, [1024, 3, 2]]         # 9  P5/32
  - [-1, 2, C3k2, [1024, True]]         # 10
  - [-1, 1, SPPF, [1024, 5]]            # 11
  - [-1, 2, C2PSA, [1024]]              # 12
  - [-1, 1, DCAConv_v2, []]             # 13 backbone P5 + DCAv2

head:
  # FPN top-down (Concat -> CS_HFCM at skip connections)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14  P5 -> P4
  - [[-1, 7], 1, CS_HFCM, []]                       # 15  +backbone P4 (cross-scale)
  - [-1, 2, C3k2, [512, False]]                     # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 17  P4 -> P3
  - [[-1, 4], 1, CS_HFCM, []]                        # 18  +backbone P3 (cross-scale)
  - [-1, 2, C3k2, [256, False]]                      # 19 (P3/8-small)

  # PAN bottom-up (standard)
  - [-1, 1, Conv, [256, 3, 2]]                       # 20
  - [[-1, 16], 1, Concat, [1]]                       # 21
  - [-1, 2, C3k2, [512, False]]                      # 22 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                       # 23
  - [[-1, 13], 1, Concat, [1]]                       # 24
  - [-1, 2, C3k2, [1024, True]]                      # 25 (P5/32-large)

  - [[19, 22, 25], 1, Detect, [nc]]                   # 26
